x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-meta-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    PYTHONPATH: /opt/airflow
    WAREHOUSE_DB_HOST: ${WAREHOUSE_DB_HOST:-warehouse-db}
    WAREHOUSE_DB_PORT: ${WAREHOUSE_DB_PORT:-5432}
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-retail}
    WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-retail_user}
    WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-retail_pass}
    # '-' (NOT ':-') on the endpoint: an explicitly blank value in .env must
    # pass through as blank = use real AWS S3. With ':-', blank is treated as
    # unset and silently falls back to local MinIO — which then rejects the
    # real AWS keys below with InvalidAccessKeyId.
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://minio:9000}
    S3_BUCKET: ${S3_BUCKET:-retail-lakehouse}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    AWS_REGION: ${AWS_REGION:-af-south-1}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./sql:/opt/airflow/sql
    - ./tests:/opt/airflow/tests
    - airflow_logs:/opt/airflow/logs
  depends_on:
    - airflow-meta-db
    - warehouse-db
    - minio

services:
  # Airflow's OWN internal bookkeeping db (task state, DAG runs, etc.)
  # Not to be confused with our warehouse-db below — new students almost
  # always conflate these two and it causes hours of confusion.
  airflow-meta-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # Silver + gold layers live here (dbt-postgres target locally).
  # In production this becomes Athena querying Parquet on S3 directly —
  # same dbt project, different adapter, that's the whole appeal of dbt.
  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_pass
      POSTGRES_DB: retail
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "retail_user"]
      interval: 5s
      retries: 5

  # S3-compatible bronze zone. Raw scraped/simulated JSON lands here
  # untouched, partitioned by vendor + date — classic medallion bronze.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console — browse the bronze zone visually
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 5

  # One-shot job: creates the bronze bucket on first startup so the
  # pipeline never has to handle "bucket doesn't exist yet" at runtime.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/retail-lakehouse;
      echo 'Bronze bucket ready.'
      "

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

  # dbt (gold layer). Profiled: never starts with `docker compose up`;
  # run one-shot via `make dbt-build` (= docker compose run --profile dbt
  # --rm dbt build). Env mirrors airflow-common so the same .env works
  # for local warehouse-db or real RDS.
  dbt:
    profiles: ["dbt"]
    build:
      context: ./dbt
    environment:
      DBT_PROFILES_DIR: /dbt
      DO_NOT_TRACK: "1"
      WAREHOUSE_DB_HOST: ${WAREHOUSE_DB_HOST:-warehouse-db}
      WAREHOUSE_DB_PORT: ${WAREHOUSE_DB_PORT:-5432}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-retail}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-retail_user}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-retail_pass}
    volumes:
      - ./dbt:/dbt
    depends_on:
      warehouse-db:
        condition: service_healthy

volumes:
  airflow_meta_data:
  warehouse_data:
  airflow_logs:
  minio_data:
