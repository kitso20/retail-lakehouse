name: CI

# This is the CI part of "CI/CD" — it runs automatically on every push,
# so a broken transform function gets caught before it ever reaches a
# recruiter's eyes (or a live DAG run). The CD (deploy) step gets added
# once we wire up AWS.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs the suite with a coverage gate: include/ (the pipeline code)
      # must stay >= 90% covered. dags/ isn't measured here because
      # importing it needs airflow, which only exists in the docker
      # image — CI still checks it via pyflakes + the AST tests in
      # tests/test_dag.py (which run without airflow).
      - name: Run unit tests (coverage gate on include/)
        run: >-
          python -m pytest tests/ -v
          --cov=include --cov-report=term-missing --cov-fail-under=90

      - name: Lint
        run: python -m pyflakes include dags

      - name: Install dbt
        run: pip install "dbt-core~=1.8.0" "dbt-postgres~=1.8.0"

      # Parses the dbt project (YAML, refs, macros) without connecting
      # to a warehouse — catches broken models before CD ever runs.
      - name: Validate dbt project
        run: dbt parse --project-dir dbt --profiles-dir dbt
